name: iksha
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  flutter_downloader: ^1.8.0
  path_provider: ^2.0.13



  carousel_slider:
    git:
      url: https://github.com/sampaio96/flutter_carousel_slider.git
      ref: master
  flutter_svg: ^2.0.16
  video_player: ^2.9.1
  swipeable_page_route: ^0.4.3
  chewie: ^1.3.5
  url_launcher: ^6.3.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  permission_handler: ^11.3.1
  animated_text_kit: ^4.2.2
  easy_rich_text: ^2.2.0
  image_cropper: ^8.1.0

  http: any
  flutter_dotenv: ^5.2.1
  langchain: ^0.7.7+2
  langchain_google: ^0.6.4+2
  provider: ^6.1.2
  flutter_localization: ^0.3.0
  timeago: ^3.7.0
  audioplayers: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0




flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - .env

  fonts:
    - family: Deva
      fonts:
        - asset: assets/fonts/DevTitle.TTF
    - family: DevaHead
      fonts:
        - asset: assets/fonts/DevHead.TTF
    - family: LibreBaskerville
      fonts:
        - asset: fonts/LibreBaskerville-Regular.ttf
        - asset: fonts/LibreBaskerville-Italic.ttf
          style: italic
        - asset: fonts/LibreBaskerville-Bold.ttf
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairRegular.ttf
    - family: Eczar
      fonts:
        - asset: assets/fonts/Eczar-Regular.ttf
        - asset: assets/fonts/Eczar-Medium.ttf
        - asset: assets/fonts/Eczar-SemiBold.ttf
        - asset: assets/fonts/Eczar-Bold.ttf
        - asset: assets/fonts/Eczar-ExtraBold.ttf
    - family: Yatra
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf

  generate: true
