name: iksha
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  carousel_slider: ^4.2.1
  flutter_svg: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: LibreBaskerville
      fonts:
        - asset: fonts/LibreBaskerville-Regular.ttf
        - asset: fonts/LibreBaskerville-Italic.ttf
          style: italic
        - asset: fonts/LibreBaskerville-Bold.ttf
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairRegular.ttf
    - family: Eczar
      fonts:
        - asset: assets/fonts/Eczar-Regular.ttf
        - asset: assets/fonts/Eczar-Medium.ttf
        - asset: assets/fonts/Eczar-SemiBold.ttf
        - asset: assets/fonts/Eczar-Bold.ttf
        - asset: assets/fonts/Eczar-ExtraBold.ttf


